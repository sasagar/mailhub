name: build-sync

on:
  push:
    branches: [main]
    paths: [apps/sync/**, packages/db/**, pnpm-lock.yaml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 外部の action はコミットの SHA で固定する（タグは付け替えられる。ビルドしたイメージは keel が数分で本番に入れるので、
    # action が乗っ取られるとマスターキーを持つ Pod でそのコードが動いてしまう）。更新するときは SHA ごと差し替える
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/sync/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/sasagar/mailhub-sync:latest
            ghcr.io/sasagar/mailhub-sync:${{ github.sha }}
