name: build-sync

on:
  push:
    branches: [main]
    paths: [apps/sync/**, packages/db/**, pnpm-lock.yaml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/sync/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/sasagar/mailhub-sync:latest
            ghcr.io/sasagar/mailhub-sync:${{ github.sha }}
