name: build-sync

on:
  push:
    branches: [main]
    paths: [apps/sync/**, packages/db/**, pnpm-lock.yaml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 外部の action はコミットの SHA で固定する（タグは付け替えられる。ビルドしたイメージは keel が数分で本番に入れるので、
    # action が乗っ取られるとマスターキーを持つ Pod でそのコードが動いてしまう）。更新するときは SHA ごと差し替える
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: apps/sync/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/sasagar/mailhub-sync:latest
            ghcr.io/sasagar/mailhub-sync:${{ github.sha }}
