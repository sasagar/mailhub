# 適用: samurai-watch で kubectl apply -f（Secret は別途 README の手順で作る）
apiVersion: v1
kind: Namespace
metadata:
  name: mailhub
---
# keel（ikaskey-gatekeeper namespace で動いている）にこの namespace の Deployment を入れ替えさせる
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keel-manage
  namespace: mailhub
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, update, patch]
  - apiGroups: ['']
    resources: [events]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keel-manage
  namespace: mailhub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keel-manage
subjects:
  - kind: ServiceAccount
    name: keel
    namespace: ikaskey-gatekeeper
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhub-sync
  namespace: mailhub
  annotations:
    keel.sh/policy: force
    keel.sh/matchTag: 'true'
    keel.sh/trigger: poll
    keel.sh/pollSchedule: '@every 3m'
spec:
  # 同じアカウントに二重接続させないため、必ず 1 つだけ。更新時も旧 Pod を止めてから起動する
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mailhub-sync
  template:
    metadata:
      labels:
        app: mailhub-sync
    spec:
      nodeSelector:
        kubernetes.io/hostname: sakura
      # k8s の API は使わないので、サービスアカウントのトークンを Pod に入れない
      automountServiceAccountToken: false
      # Secret のファイルを、コンテナのユーザー（1000）がグループとして読めるようにする
      securityContext:
        fsGroup: 1000
      terminationGracePeriodSeconds: 30
      containers:
        - name: sync
          image: ghcr.io/sasagar/mailhub-sync:latest
          env:
            # ノード上で動いている Postgres へノード IP で繋ぐ
            - name: PGHOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: PGDATABASE
              value: mailhub
            - name: PGUSER
              value: mailhub
            - name: TZ
              value: Asia/Tokyo
            # 秘密の値は環境変数ではなくファイルで渡す（/proc/<pid>/environ から読まれないように）
            - name: PGPASSWORD_FILE
              value: /run/secrets/mailhub/PGPASSWORD
            - name: MAILHUB_MASTER_KEY_FILE
              value: /run/secrets/mailhub/MAILHUB_MASTER_KEY
            - name: GOOGLE_CLIENT_ID_FILE
              value: /run/secrets/mailhub/GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET_FILE
              value: /run/secrets/mailhub/GOOGLE_CLIENT_SECRET
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 384Mi
          securityContext:
            # イメージの USER は名前（node）なので、root でないことを k8s が確かめられるよう UID を数字で渡す
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secret
              mountPath: /run/secrets/mailhub
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: secret
          secret:
            secretName: mailhub-secret # PGPASSWORD, MAILHUB_MASTER_KEY, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
            defaultMode: 0440
